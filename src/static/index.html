        <h1>Dashboard</h1>
        <div class="sidebar">
            <h3>Course Navigation</h3>

            <h2>Today's Learning</h2>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script type="text/javascript">
        async function loadPyodideAndRunCode() {
            await loadPyodide({
                fullStdLib: false,
                stdin: {type: 'webworker'},
                stdout: {type: 'webworker'},
                stderr: {type: 'webworker'}
            });

            try {
                let result = await pyodide.runPythonAsync(`print("Hello, Python Coach!")`);
                console.log(result);
            } catch (error) {
                console.error(error);
            }
        }

        window.onload = loadPyodideAndRunCode;
    </script>
